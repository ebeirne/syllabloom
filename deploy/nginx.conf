# /etc/nginx/sites-available/syllabloom  (replace example.com with your domain)
# After the first run, `certbot --nginx -d example.com -d www.example.com` adds HTTPS.

limit_req_zone $binary_remote_addr zone=syllabloom_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/syllabloom;
    index index.html;

    # Same headers the Vercel deployment sent.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Large documents are PUT straight to disk by the app (100 MB limit enforced in Python too).
    location /api/source-upload/ {
        client_max_body_size 101m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/syllabloom-proxy.conf;
    }

    location /api/ {
        client_max_body_size 10m;
        limit_req zone=syllabloom_api burst=40 nodelay;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/syllabloom-proxy.conf;
    }

    # Only the pre-built static site is served from /var/www/syllabloom (see deploy.sh).
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        # add_header in a location drops the server-level ones, so repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
